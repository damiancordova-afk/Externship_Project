<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Recruiting Directory — Valon</title>
  <style>
    /* ============================================================
       Brand tokens
       ============================================================ */
    :root {
      /* Warm neutral base */
      --white: #FFFFFF;
      --n-100: #F8F6F3;
      --n-200: #ECE4DD;
      --n-300: #DCD2C6;
      --n-400: #AF9F8A;
      --n-500: #827057;
      --n-600: #5C543C;
      --n-700: #4A402C;
      --n-800: #31231B;
      --n-900: #20190F;
      --n-950: #231810;

      /* Gold accent */
      --gold-400: #EBB03C;
      --gold-500: #E19614;
      --gold-600: #BE7E10;

      /* Muted text — always rgba of ink, never gray hex */
      --ink: #231810;
      --text-body: rgba(35, 24, 16, 0.80);
      --text-secondary: rgba(35, 24, 16, 0.60);
      --text-label: rgba(35, 24, 16, 0.40);
      --border-soft: rgba(35, 24, 16, 0.10);
      --border-hover: rgba(35, 24, 16, 0.20);
      --divider: rgba(35, 24, 16, 0.08);
      --row-hover: rgba(35, 24, 16, 0.05);

      --radius-input: 8px;
      --radius-card: 12px;
      --shadow-menu: 0 4px 12px rgba(35, 24, 16, 0.10);
      --ease: 150ms ease;

      --font-sans: "KMR Melange Grotesk", -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo,
        Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--n-100);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Global focus ring — visible for keyboard nav */
    :focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }
    /* Suppress focus ring for pointer users, keep for keyboard */
    :focus:not(:focus-visible) { outline: none; }

    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px 96px;
    }

    /* ============================================================
       Header bar
       ============================================================ */
    .header {
      height: 44px;
      padding: 12px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-sizing: content-box;
    }
    .header__left {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }
    .wordmark {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 400;
      letter-spacing: -0.5px;
      color: var(--ink);
    }
    .wordmark__mark {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--white);
      display: grid;
      place-items: center;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: -0.5px;
    }
    .wordmark__name {
      font-size: 18px;
      letter-spacing: -0.6px;
    }
    .header__divider {
      width: 1px;
      height: 20px;
      background: var(--border-soft);
    }
    .header__label {
      font-size: 14px;
      color: var(--text-secondary);
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    /* Circular icon button */
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--n-100);
      color: var(--ink);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background var(--ease);
      flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--n-200); }
    .icon-btn svg { width: 20px; height: 20px; }

    /* ============================================================
       Title block
       ============================================================ */
    .intro {
      padding: 48px 0 32px;
    }
    .intro h1 {
      margin: 0 0 8px;
      font-weight: 400;
      font-size: 32px;
      letter-spacing: -0.8px;
      color: var(--ink);
    }
    .intro p {
      margin: 0;
      font-size: 16px;
      color: var(--text-body);
      max-width: 60ch;
    }

    /* ============================================================
       Search + filters
       ============================================================ */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }
    .search {
      position: relative;
    }
    .search__icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      color: var(--text-secondary);
      pointer-events: none;
    }
    .search input {
      width: 100%;
      height: 48px;
      border-radius: var(--radius-input);
      border: 1px solid var(--border-soft);
      background: var(--white);
      padding: 12px 16px 12px 48px;
      font-family: var(--font-sans);
      font-size: 16px;
      color: var(--ink);
      transition: border-color var(--ease), box-shadow var(--ease);
    }
    .search input::placeholder { color: var(--text-secondary); }
    .search input:hover { border-color: var(--border-hover); }
    .search input:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
      border-color: transparent;
    }

    .filters {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filters__label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-label);
      margin-right: 8px;
    }
    .pill {
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-input);
      background: var(--white);
      padding: 6px 12px;
      font-family: var(--font-sans);
      font-size: 14px;
      color: var(--text-body);
      cursor: pointer;
      transition: border-color var(--ease), background var(--ease), color var(--ease);
      min-height: 32px;
    }
    .pill:hover { border-color: var(--border-hover); }
    .pill[aria-pressed="true"] {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--white);
    }

    /* ============================================================
       Table container
       ============================================================ */
    .table {
      background: var(--white);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-card);
      overflow: hidden;
    }
    .table__head {
      display: grid;
      grid-template-columns: 1fr auto 40px;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--divider);
    }
    .col-head {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-label);
    }
    .col-head--hires { text-align: right; }

    .row {
      display: grid;
      grid-template-columns: 1fr auto 40px;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 16px 24px;
      border: none;
      border-bottom: 1px solid var(--divider);
      background: transparent;
      text-align: left;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: background var(--ease);
    }
    .row:last-child { border-bottom: none; }
    .row:hover { background: var(--row-hover); }
    .row:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: -2px;
    }

    .row__name-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .row__name {
      font-size: 16px;
      color: var(--ink);
      letter-spacing: -0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row__hires {
      font-size: 14px;
      color: var(--text-secondary);
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .row__chevron {
      color: var(--text-secondary);
      display: grid;
      place-items: center;
      transition: transform var(--ease), color var(--ease);
    }
    .row:hover .row__chevron { color: var(--ink); transform: translateX(2px); }
    .row__chevron svg { width: 20px; height: 20px; }

    /* Tier tags */
    .tier {
      font-size: 12px;
      letter-spacing: 0.2px;
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tier--1 {
      background: rgba(235, 176, 60, 0.18);
      color: var(--gold-600);
    }
    .tier--2 {
      background: var(--n-200);
      color: var(--n-700);
    }
    .tier--3 {
      background: var(--n-100);
      color: var(--text-body);
      border: 1px solid var(--border-soft);
    }

    .empty {
      padding: 64px 24px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 15px;
    }

    .result-count {
      margin: 0 0 16px;
      font-size: 13px;
      color: var(--text-secondary);
      letter-spacing: -0.1px;
    }

    /* ============================================================
       Detail modal (placeholder)
       ============================================================ */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(35, 24, 16, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 50;
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--white);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-menu);
      width: 100%;
      max-width: 480px;
      padding: 32px;
    }
    .modal__top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }
    .modal__title {
      margin: 0 0 8px;
      font-weight: 400;
      font-size: 24px;
      letter-spacing: -0.6px;
      color: var(--ink);
    }
    .modal__meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: var(--text-secondary);
    }
    .modal__placeholder {
      background: var(--n-100);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-input);
      padding: 32px 24px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 24px;
    }
    .modal__id {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-label);
    }
    .modal__actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    /* Buttons */
    .btn {
      font-family: var(--font-sans);
      font-size: 15px;
      height: 48px;
      padding: 12px 24px;
      border-radius: var(--radius-input);
      border: none;
      cursor: pointer;
      transition: background var(--ease);
      letter-spacing: -0.2px;
    }
    .btn--primary {
      background: var(--ink);
      color: var(--white);
    }
    .btn--primary:hover { background: rgba(35, 24, 16, 0.9); }
    .btn--secondary {
      background: rgba(35, 24, 16, 0.1);
      color: var(--ink);
    }
    .btn--secondary:hover { background: rgba(35, 24, 16, 0.2); }

    /* ============================================================
       Responsive — stacked cards under 480px
       ============================================================ */
    @media (max-width: 480px) {
      .page { padding: 0 16px 64px; }
      .intro { padding: 32px 0 24px; }
      .intro h1 { font-size: 26px; }
      .header__label { display: none; }

      .table { background: transparent; border: none; border-radius: 0; overflow: visible; }
      .table__head { display: none; }

      .row {
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 16px;
        background: var(--white);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius-card);
        margin-bottom: 16px;
        min-height: 44px;
      }
      .row:last-child { border-bottom: 1px solid var(--border-soft); margin-bottom: 0; }
      .row__name-wrap { flex-wrap: wrap; }
      .row__hires { text-align: left; }
      .row__chevron { display: none; }
    }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0);
      white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- Header -->
    <header class="header">
      <div class="header__left">
        <div class="wordmark">
          <span class="wordmark__mark" aria-hidden="true">V</span>
          <span class="wordmark__name">Valon</span>
        </div>
        <span class="header__divider" aria-hidden="true"></span>
        <span class="header__label">Campus Recruiting</span>
      </div>
      <button class="icon-btn" type="button" aria-label="Go to dashboard" title="Dashboard">
        <!-- home icon, outline 1.5px -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5" />
          <path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5" />
        </svg>
      </button>
    </header>

    <!-- Intro -->
    <section class="intro">
      <h1>Campus Recruiting Directory</h1>
      <p>Colleges and universities Valon has hired from, organized by recruiting tier and total hires to date.</p>
    </section>

    <!-- Controls -->
    <div class="controls">
      <div class="search">
        <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
        <input id="search" type="search" placeholder="Search by school name..."
          autocomplete="off" aria-label="Search by school name" />
      </div>
      <div class="filters" role="group" aria-label="Filter by tier">
        <span class="filters__label">Tier</span>
        <button class="pill" type="button" data-tier="1" aria-pressed="false">Tier 1</button>
        <button class="pill" type="button" data-tier="2" aria-pressed="false">Tier 2</button>
        <button class="pill" type="button" data-tier="3" aria-pressed="false">Tier 3</button>
      </div>
    </div>

    <p class="result-count" id="resultCount" aria-live="polite"></p>

    <!-- Table -->
    <div class="table" role="table" aria-label="Campus recruiting directory">
      <div class="table__head" role="row">
        <span class="col-head" role="columnheader">School</span>
        <span class="col-head col-head--hires" role="columnheader">Hires</span>
        <span class="col-head" role="columnheader" aria-hidden="true"></span>
      </div>
      <div id="rows"></div>
      <div class="empty" id="empty" hidden>No schools match your search.</div>
    </div>
  </div>

  <!-- Detail modal -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal__top">
        <div>
          <h2 class="modal__title" id="modalTitle">School name</h2>
          <div class="modal__meta">
            <span id="modalTier"></span>
            <span aria-hidden="true">·</span>
            <span id="modalHires"></span>
          </div>
        </div>
        <button class="icon-btn" type="button" id="modalClose" aria-label="Close detail">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <div class="modal__placeholder">
        School detail placeholder
        <div style="margin-top:8px;" class="modal__id" id="modalId"></div>
      </div>
      <div class="modal__actions">
        <button class="btn btn--secondary" type="button" id="modalCloseBtn">Close</button>
        <button class="btn btn--primary" type="button">View full profile</button>
      </div>
    </div>
  </div>

  <script>
    // ------------------------------------------------------------
    // Mock data
    // ------------------------------------------------------------
    const SCHOOLS = [
      { id: "SCH-001", name: "Stanford University", tier: 1, hires: 24 },
      { id: "SCH-002", name: "Massachusetts Institute of Technology", tier: 1, hires: 21 },
      { id: "SCH-003", name: "University of California, Berkeley", tier: 1, hires: 19 },
      { id: "SCH-004", name: "Carnegie Mellon University", tier: 1, hires: 16 },
      { id: "SCH-005", name: "University of Michigan", tier: 2, hires: 14 },
      { id: "SCH-006", name: "Georgia Institute of Technology", tier: 2, hires: 12 },
      { id: "SCH-007", name: "University of Texas at Austin", tier: 2, hires: 11 },
      { id: "SCH-008", name: "University of Illinois Urbana-Champaign", tier: 2, hires: 9 },
      { id: "SCH-009", name: "Purdue University", tier: 2, hires: 8 },
      { id: "SCH-010", name: "Cornell University", tier: 1, hires: 15 },
      { id: "SCH-011", name: "Arizona State University", tier: 3, hires: 6 },
      { id: "SCH-012", name: "San José State University", tier: 3, hires: 5 },
      { id: "SCH-013", name: "University of Washington", tier: 2, hires: 10 },
      { id: "SCH-014", name: "Rutgers University", tier: 3, hires: 4 },
      { id: "SCH-015", name: "Northeastern University", tier: 3, hires: 7 },
    ];

    const TIER_LABEL = { 1: "Tier 1", 2: "Tier 2", 3: "Tier 3" };

    // ------------------------------------------------------------
    // State
    // ------------------------------------------------------------
    let query = "";
    const activeTiers = new Set();

    const rowsEl = document.getElementById("rows");
    const emptyEl = document.getElementById("empty");
    const countEl = document.getElementById("resultCount");

    function filtered() {
      const q = query.trim().toLowerCase();
      return SCHOOLS.filter(s => {
        const matchQ = !q || s.name.toLowerCase().includes(q);
        const matchT = activeTiers.size === 0 || activeTiers.has(s.tier);
        return matchQ && matchT;
      });
    }

    function chevron() {
      return `<span class="row__chevron"><svg viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></span>`;
    }

    function render() {
      const list = filtered();
      rowsEl.innerHTML = "";

      list.forEach(s => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "row";
        btn.setAttribute("role", "row");
        btn.setAttribute("aria-label", `${s.name}, ${TIER_LABEL[s.tier]}, ${s.hires} hires`);
        btn.innerHTML = `
          <span class="row__name-wrap">
            <span class="row__name">${s.name}</span>
            <span class="tier tier--${s.tier}">${TIER_LABEL[s.tier]}</span>
          </span>
          <span class="row__hires">${s.hires} hire${s.hires === 1 ? "" : "s"}</span>
          ${chevron()}
        `;
        btn.addEventListener("click", () => openDetail(s));
        rowsEl.appendChild(btn);
      });

      emptyEl.hidden = list.length !== 0;
      const total = SCHOOLS.length;
      countEl.textContent = list.length === total
        ? `${total} schools`
        : `${list.length} of ${total} schools`;
    }

    // ------------------------------------------------------------
    // Modal
    // ------------------------------------------------------------
    const overlay = document.getElementById("overlay");
    let lastFocused = null;

    function openDetail(s) {
      lastFocused = document.activeElement;
      document.getElementById("modalTitle").textContent = s.name;
      document.getElementById("modalTier").textContent = TIER_LABEL[s.tier];
      document.getElementById("modalHires").textContent =
        `${s.hires} hire${s.hires === 1 ? "" : "s"}`;
      document.getElementById("modalId").textContent = s.id;
      overlay.classList.add("open");
      document.getElementById("modalClose").focus();
    }

    function closeDetail() {
      overlay.classList.remove("open");
      if (lastFocused) lastFocused.focus();
    }

    document.getElementById("modalClose").addEventListener("click", closeDetail);
    document.getElementById("modalCloseBtn").addEventListener("click", closeDetail);
    overlay.addEventListener("click", e => { if (e.target === overlay) closeDetail(); });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && overlay.classList.contains("open")) closeDetail();
    });

    // ------------------------------------------------------------
    // Controls
    // ------------------------------------------------------------
    document.getElementById("search").addEventListener("input", e => {
      query = e.target.value;
      render();
    });

    document.querySelectorAll(".pill").forEach(pill => {
      pill.addEventListener("click", () => {
        const tier = Number(pill.dataset.tier);
        const on = pill.getAttribute("aria-pressed") === "true";
        pill.setAttribute("aria-pressed", String(!on));
        if (on) activeTiers.delete(tier); else activeTiers.add(tier);
        render();
      });
    });

    render();
  </script>
</body>
</html>
