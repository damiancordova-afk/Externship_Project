name: Refresh career fairs

# Scrapes each college's career-center page and commits any newly-found upcoming
# fairs into career_fairs.json (the single source of truth). The directory page
# is regenerated from that JSON by build_directory.py and is never committed
# (it contains candidate PII), so this job only touches career_fairs.json.
#
# Runs weekly and can be triggered manually from the Actions tab.

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC (~6am PT)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-fairs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape and merge new fairs
        run: python scripts/scrape_fairs.py

      - name: Commit changes if any
        run: |
          if [[ -n "$(git status --porcelain career_fairs.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add career_fairs.json
            git commit -m "chore: refresh career-fair dates (automated scrape)"
            git push
          else
            echo "No changes to commit."
          fi
