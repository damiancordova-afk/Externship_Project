name: Refresh career fairs

# Scrapes each college's career-center page and commits any newly-found upcoming
# fairs into career_fairs.json (the single source of truth). The directory page
# is regenerated from that JSON by build_directory.py and is never committed
# (it contains candidate PII), so this job only touches career_fairs.json.
#
# Runs weekly and can be triggered manually from the Actions tab.

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC (~6am PT)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-fairs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Chromium (only if a source needs JS rendering)
        run: |
          if [ -f fair_sources.json ] && grep -q '"render"' fair_sources.json; then
            python -m playwright install --with-deps chromium
          else
            echo "No render:true sources — skipping Chromium install."
          fi

      - name: Scrape fairs + monthly discovery
        # Scraping runs every week. The discovery step self-throttles to ~monthly
        # and only does anything when a search-API key is present. Any of these
        # secrets works; missing ones are simply empty (discovery no-ops).
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          BING_SEARCH_KEY: ${{ secrets.BING_SEARCH_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        run: python scripts/scrape_fairs.py

      - name: Commit changes if any
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add career_fairs.json
          [ -f fair_sources_pending.json ] && git add fair_sources_pending.json || true
          [ -f fair_sources.json ] && git add fair_sources.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh career fairs + discovery candidates (automated)"
            git push
          fi
